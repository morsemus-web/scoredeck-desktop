name: Release desktop apps

# Push a tag like v0.1.0 to trigger a cross-platform build.
# Windows, macOS (universal), and Linux (AppImage + .deb) artifacts land as
# a GitHub Release attached to the tag. All UNSIGNED.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # npm install (not ci) so lockfile drift between OSes doesn't hard-fail;
        # legacy peer deps for React 19 + Electron transitive peers.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Ensure app icon exists
        shell: bash
        run: |
          if [ ! -f build/icon.png ] && [ -f electron/icon.png ]; then
            mkdir -p build
            cp electron/icon.png build/icon.png
          fi

      - name: Build renderer + package (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build renderer + package (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CSC_* signing vars = unsigned build. Universal DMG.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build renderer + package (Linux)
        if: matrix.os == 'ubuntu-latest'
        # Linux electron-builder needs a few native libs preinstalled on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm fakeroot dpkg
          npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scoredeck-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn

  publish:
    needs: build
    # Publish whatever succeeded even if one platform fails.
    if: startsWith(github.ref, 'refs/tags/v') && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
